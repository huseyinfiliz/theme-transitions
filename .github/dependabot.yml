version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: flarum/core
        update-types:
          - version-update:semver-major
      - dependency-name: flarum/testing
        update-types:
          - version-update:semver-major
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  # Dependabot uses the npm ecosystem for Yarn manifests and lockfiles.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # flarum-tsconfig@^2.0.0 targets TypeScript 5.x (moduleResolution: Node).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      javascript-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
